  setTimeout(function(){raining=true;rainRate=1.5;var r=setInterval(function(){rainRate=Math.min(rainRate+.7,7);if(rainRate>=7)clearInterval(r)},900)},2200);
  setTimeout(function(){B.classList.add('cin');$('scrim').classList.add('on');zt=1.05;zk=.25},3000);
  setTimeout(function(){seq($('msgIn'),CONFIG.MESSAGE,alarm)},4400)}
function alarm(){ph='siren';musicOff();raining=false;zt=1;zk=1;$('scrim').classList.remove('on');flash();shk=.7;
  var S=$('siren');S.classList.remove('nt');S.classList.add('on');vib(1);if(AC)siren(4.4);
  setTimeout(function(){S.classList.add('nt')},2800);
  setTimeout(function(){$('ufo').className='in';if(AC)ufoSnd(7)},3200);
  setTimeout(function(){S.classList.remove('on');vib(0)},4600);
  setTimeout(function(){$('ufo').className='hover';$('beam').classList.add('on')},6500);
  setTimeout(function(){$('boss').className='mat';if(AC)sparkle()},7000);
  setTimeout(function(){$('boss').className='stay';seq($('bossTxt'),CONFIG.BOSS,leave)},9700)}
function leave(){$('bossTxt').classList.add('out');$('boss').className='suck';if(AC)noise(AC.currentTime,1.1,.4,3000,300);
  setTimeout(function(){$('beam').classList.remove('on')},700);
  setTimeout(function(){$('ufo').className='fly';var S=$('siren');S.classList.add('nt','on');vib(1);if(AC){siren(2.6);noise(AC.currentTime,1.2,.6,200,3500)}},1300);
  setTimeout(function(){$('siren').classList.remove('on');vib(0)},3300);
  setTimeout(reset,3900)}
function reset(){var F=$('fade');F.classList.add('on');
  setTimeout(function(){
    B.classList.remove('cin');['boss','ufo'].forEach(function(i){$(i).className=''});$('beam').classList.remove('on');$('bossTxt').className='';$('bossTxt').innerHTML='';$('msgIn').innerHTML='';$('msgIn').className='';
    drops=[];parts=[];raining=false;hv=0;zt=zm=1;$('title').classList.remove('off');$('launch').classList.remove('open','off');$('launch').querySelector('.dome').classList.remove('down');$('enterLbl').classList.remove('off');$('credit').classList.remove('off');
    var old=AC;AC=null;if(old){try{old.close()}catch(e){}}
    ph='idle';setTimeout(function(){F.classList.remove('on')},300)},1100)}
$('launch').addEventListener('click',go);$('enterLbl').addEventListener('click',go);
})();
